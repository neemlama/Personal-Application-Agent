<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Step 2: Education Details (Sahayogi Mock Portal)</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="demo-banner">⚠️ DEMO PORTAL — NOT A REAL GOVERNMENT WEBSITE — for automated testing only.</div>
<header class="portal-header">
  <h1>Demo Technical Education Special Scholarship Portal</h1>
</header>
<main>
  <div class="steps">
    <span>1. Personal Info</span>
    <span class="active">2. Education</span>
    <span>3. Eligibility</span>
    <span>4. Documents</span>
    <span>5. Review &amp; Submit</span>
  </div>
  <h2>Step 2 of 5 — Education Details</h2>
  <form id="step2-form">
    <label for="see_symbol_number">SEE/SLC Symbol Number</label>
    <input type="text" id="see_symbol_number" name="see_symbol_number" required />

    <label for="exam_year_bs">Exam Year (B.S.)</label>
    <input type="text" id="exam_year_bs" name="exam_year_bs" required />

    <label for="school_name">School Name</label>
    <input type="text" id="school_name" name="school_name" required />

    <label for="gpa_or_division">GPA / Division Obtained</label>
    <input type="text" id="gpa_or_division" name="gpa_or_division" required />

    <label for="desired_program">Desired Technical Program</label>
    <select id="desired_program" name="desired_program" required>
      <option value="">-- Select --</option>
      <option value="Diploma in Civil Engineering">Diploma in Civil Engineering</option>
      <option value="Diploma in Electrical Engineering">Diploma in Electrical Engineering</option>
      <option value="Diploma in Computer Engineering">Diploma in Computer Engineering</option>
      <option value="Pre-Diploma in General Technology">Pre-Diploma in General Technology</option>
    </select>

    <div class="actions">
      <a class="btn secondary" href="step1-personal.html">Back</a>
      <button type="submit">Next: Eligibility &amp; Category</button>
    </div>
  </form>
</main>
<script src="portal.js"></script>
<script>
  const form = document.getElementById("step2-form");
  window.addEventListener("DOMContentLoaded", () => prefillForm(form));
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    goToNext(form, "step3-eligibility.html");
  });
</script>
</body>
</html>
