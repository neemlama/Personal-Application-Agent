<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RSVP Confirmed (FormBuddy Demo)</title>
<style>
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f8fafc; color: #0f172a; }
  .demo-banner { background: #b3261e; color: white; text-align: center; padding: 8px 12px; font-size: 14px; font-weight: bold; }
  header { background: #1d4ed8; color: white; padding: 22px 24px; }
  header h1 { margin: 0; font-size: 20px; }
  main { max-width: 560px; margin: 40px auto; background: white; border: 1px solid #d6dde3; border-radius: 8px; padding: 30px; text-align: center; }
  .ref { font-size: 24px; font-weight: bold; color: #1d4ed8; margin: 14px 0; }
</style>
</head>
<body>
<div class="demo-banner">⚠️ DEMO FORM — NOT A REAL EVENT — no RSVP was actually filed anywhere.</div>
<header><h1>🎤 Kathmandu Tech Meetup — August Edition</h1></header>
<main>
  <h2>✅ RSVP Confirmed</h2>
  <p>Your confirmation code:</p>
  <div class="ref" id="ref-code">—</div>
  <p style="font-size: 13px; color: #64748b;">This is a fictional confirmation for demo/automation-testing purposes only.</p>
  <a href="index.html" style="color:#1d4ed8;">RSVP again</a>
</main>
<script>
  document.getElementById("ref-code").textContent = sessionStorage.getItem("rsvp_ref") || "(none found)";
</script>
</body>
</html>
